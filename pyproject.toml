[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_spacemouse"
version = "1.1.1"
description = "SpaceMouse teleoperation plugin and Cartesian control adapters for LeRobot."
readme = "README.md"
# LeRobot 0.5+ has the same minimum; lowering this does not make the
# combined environment installable on an older Python.
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Shunyu Yao" },
]
keywords = ["lerobot", "spacemouse", "3dconnexion", "teleoperation", "robotics", "soarm", "so101", "dexterous-manipulation", "precise-teleoperation", "robot-arm", "inverse-kinematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# The LeRobot upper bound is raised one minor release at a time, once CI passes against it
# (.github/workflows/tests.yml). LeRobot minor releases do break plugins.
dependencies = [
    "lerobot[feetech,kinematics]>=0.5.0,<0.8.0",
    # Not imported directly. placo's wheels link against urdfdom 4, but LeRobot 0.5 does not pin it,
    # so a fresh install there picks cmeel-urdfdom 6 and `import placo` fails. LeRobot 0.6+ pins these.
    "cmeel-urdfdom>=4,<5",
    "cmeel-tinyxml2<11",
    "numpy>=2.0.0",
    "pyspacemouse>=1.1.5,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0,<2.0.0",
    # tests/test_lerobot_integration.py imports lerobot-record, which needs it from LeRobot 0.6 on.
    "lerobot[dataset]",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0",
    "twine>=6.0.0,<7.0.0",
]

[project.urls]
homepage = "https://github.com/Jas000n/lerobot-teleoperator-spacemouse"
source = "https://github.com/Jas000n/lerobot-teleoperator-spacemouse"
issues = "https://github.com/Jas000n/lerobot-teleoperator-spacemouse/issues"

[project.scripts]
lerobot-teleoperator-spacemouse-test = "lerobot_teleoperator_spacemouse.cli:test_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lerobot_teleoperator_spacemouse = ["urdfs/*.urdf"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
